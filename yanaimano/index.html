<script>document.documentElement.classList.add('js');</script>

<body>

<!-- ============================== nav ============================== -->
<header class="nav">
  <a class="nav__brand" href="../index.html" aria-label="Back to DIAZ">
    <span class="nav__badge" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M8 26 Q8 8 24 8 Q40 8 40 26 Q40 34 24 34 Q8 34 8 26 Z" fill="#c06a3c"/>

<!-- ============================== the cabinet ============================== -->
<main class="hall">
  <div class="cab">
    <canvas id="game" width="960" height="540"
            aria-label="YanaiMano — a platformer. Arrow keys or A and D to move, Space to jump."></canvas>

    <!-- touch controls (coarse pointers only) -->
    <div class="pad pad--move" aria-hidden="true">
      <button class="pad__btn" id="btnL">◀</button>
      <button class="pad__btn" id="btnR">▶</button>
    </div>
    <div class="pad pad--jump" aria-hidden="true">
      <button class="pad__btn pad__btn--big" id="btnJ">▲</button>
    </div>
  </div>

  <p class="keys">
    <b>←&nbsp;→</b> / <b>A&nbsp;D</b> move&nbsp;&nbsp;·&nbsp;&nbsp;<b>Space</b> jump
    &nbsp;&nbsp;·&nbsp;&nbsp;<b>Enter</b> confirm&nbsp;&nbsp;·&nbsp;&nbsp;<b>M</b> sound
  </p>

  <noscript><p class="keys">Supermano needs JavaScript to run. The kettle stays cold without it.</p></noscript>

  <footer class="foot">
    <span>YanaiMano is a fictional arcade from the DIAZ landing-page series.
    Supermano never smiles, even when he wins.</span>
    <a href="../index.html">← Back to DIAZ</a>
  </footer>
</main>

<script src="mano.js"></script>
</body>
